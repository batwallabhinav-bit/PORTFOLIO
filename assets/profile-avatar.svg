<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#glowGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="200" cy="200" r="168" fill="#131b31" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <path d="M 90 200 L 140 200 L 160 230" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.6"/>
  <path d="M 310 200 L 260 200 L 240 170" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.6"/>
  <circle cx="90" cy="200" r="4" fill="#6366f1"/>
  <circle cx="310" cy="200" r="4" fill="#06b6d4"/>

  <text x="200" y="225" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="96" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-3">AB</text>

  <rect x="100" y="275" width="200" height="36" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="url(#primaryGrad)" stroke-width="1.5" />
  <text x="200" y="298" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">ABHINAV BATWAL</text>

  <g transform="translate(180, 75)">
    <circle cx="20" cy="20" r="22" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="20" y="26" font-family="sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">&#128187;</text>
  </g>
</svg>